<!DOCTYPE html>
<html><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../_shared/shared.css" />
<style>
  body { padding: 110px 56px 100px; gap: 36px; }
  .hook { font-size: 124px; }
  .sub { font-family: -apple-system, "Helvetica Neue", sans-serif; font-weight: 500; font-size: 22px; color: rgba(17,17,17,0.7); margin-top: 18px; max-width: 720px; line-height: 1.4; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; flex-shrink: 0; }
  .grid-3 .frame { aspect-ratio: 3/4; overflow: hidden; border: 2px solid #111111; position: relative; }
  .grid-3 .frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }
  .grid-3 .frame .role { position: absolute; bottom: 12px; left: 12px; }
  .footer { display: flex; flex-direction: column; gap: 16px; margin-top: auto; }
</style></head>
<body>
  <span class="corner-tl">● Limited Release</span>
  <span class="corner-tr">Vol. 01 · Orlando</span>

  <div>
    <div class="hook hook-display">Three<br />Orlando<br /><span class="accent">pros.</span></div>
    <div class="sub">Same studio. Same lighting. Same retouching standard. <strong>$100 each.</strong></div>
  </div>

  <div class="grid-3">
    <div class="frame">
      <img src="../../100-headshots-assets/gallery-02.jpg" alt="Realtor headshot" />
      <span class="frame-tag role">Realtor</span>
    </div>
    <div class="frame">
      <img src="../../100-headshots-assets/gallery-04.jpg" alt="Founder headshot" />
      <span class="frame-tag role">Founder</span>
    </div>
    <div class="frame">
      <img src="../../100-headshots-assets/gallery-06.jpg" alt="Coach headshot" />
      <span class="frame-tag role">Coach</span>
    </div>
  </div>

  <div class="footer">
    <div class="specs-row">$100 <span class="dim">·</span> 15&nbsp;min <span class="dim">·</span> 1 retouched final <span class="dim">·</span> 100 spots in June</div>
    <div class="cta-pill">Claim before they fill →</div>
  </div>

  <span class="corner-bl">100headshots.com</span>
  <span class="corner-br">GLPX Studio</span>
</body></html>
