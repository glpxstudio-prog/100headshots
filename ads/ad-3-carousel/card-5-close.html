<!DOCTYPE html>
<html><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;600&family=Inter:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../_shared/shared.css" />
<style>
  body { padding: 110px 56px 90px; gap: 32px; }
  .heading { font-family: 'Anton', sans-serif; font-size: 132px; line-height: 0.93; letter-spacing: -0.02em; text-transform: uppercase; }
  .heading .accent { color: #E76F51; }
  .included { display: flex; flex-direction: column; gap: 0; border: 2px solid #111111; }
  .included .row { display: grid; grid-template-columns: 80px 1fr; align-items: center; padding: 18px 22px; border-bottom: 2px solid #111111; }
  .included .row:last-child { border-bottom: none; }
  .included .num { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; color: #E76F51; }
  .included .label { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.01em; color: #111111; text-transform: uppercase; }
  .calendar-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .day-cell { background: #111111; color: #F0EDE8; padding: 14px 12px; text-align: center; border: 2px solid #111111; }
  .day-cell .num { font-family: 'Anton', sans-serif; font-size: 48px; line-height: 1; color: #F0EDE8; }
  .day-cell .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; color: rgba(240,237,232,0.7); }
  .footer { margin-top: auto; }
</style></head>
<body>
  <span class="corner-tl">● Card 05 / 05</span>
  <span class="corner-tr">Close</span>

  <div>
    <div class="heading">What's<br /><span class="accent">included.</span></div>
  </div>

  <div class="included">
    <div class="row"><span class="num">01</span><span class="label">15-min studio session</span></div>
    <div class="row"><span class="num">02</span><span class="label">1 retouched final image</span></div>
    <div class="row"><span class="num">03</span><span class="label">Print-ready hi-res JPEG</span></div>
    <div class="row"><span class="num">04</span><span class="label">5–7 day delivery</span></div>
  </div>

  <div class="calendar-row">
    <div class="day-cell"><div class="num">04</div><div class="label">Thu Jun</div></div>
    <div class="day-cell"><div class="num">11</div><div class="label">Thu Jun</div></div>
    <div class="day-cell"><div class="num">18</div><div class="label">Thu Jun</div></div>
    <div class="day-cell"><div class="num">25</div><div class="label">Thu Jun</div></div>
  </div>

  <div class="footer">
    <div class="cta-pill">Claim my spot — $100 →</div>
  </div>

  <span class="corner-bl">100headshots.com</span>
  <span class="corner-br">GLPX Studio</span>
</body></html>
